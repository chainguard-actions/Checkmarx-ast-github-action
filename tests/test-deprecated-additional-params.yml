name: Test deprecated additional_params input - backward compatibility
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          base_uri: 'https://ast.checkmarx.net'
          cx_tenant: 'fake-tenant'
          cx_client_id: 'fake-client-id'
          cx_client_secret: 'fake-client-secret'
          project_name: 'test-project-deprecated'
          branch: 'main'
          source_dir: '.'
          additional_params: '--sast-incremental false'

      - name: Assert action ran with deprecated additional_params and failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully as expected with invalid Checkmarx credentials"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (unexpected but acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
