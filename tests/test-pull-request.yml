name: Test pull request scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/pull/42/merge
      GITHUB_EVENT_NAME: pull_request
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          base_uri: 'https://ast.checkmarx.net'
          cx_tenant: 'test-tenant'
          cx_client_id: 'test-client-id'
          cx_client_secret: 'test-client-secret'
          project_name: 'test-project'
          branch: 'feature-branch'
          repo_name: 'test-repo'
          namespace: 'test-org'
          pr_number: '42'
          source_dir: '.'

      - name: Assert action was invoked for PR
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail without real credentials
          # We verify it was invoked (not skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: action was invoked for PR scenario (outcome: ${{ steps.action.outcome }})"
