name: Test scan_params are passed to cx scan create
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          base_uri: http://127.0.0.1:1
          cx_tenant: test-tenant
          cx_client_id: test-client-id
          cx_client_secret: test-client-secret
          project_name: act-test-project
          branch: main
          scan_params: --help
      - name: Assert cxcli contains scan create help text and no scan ID
        env:
          CXCLI: ${{ steps.action.outputs.cxcli }}
          SCAN_ID: ${{ steps.action.outputs.cxScanID }}
        run: |
          echo "cxcli: $CXCLI"
          echo "scan id: $SCAN_ID"
          if ! echo "$CXCLI" | grep -qi "usage"; then
            echo "FAIL: expected help/usage text in cxcli output"
            exit 1
          fi
          if ! echo "$CXCLI" | grep -qi "project-name"; then
            echo "FAIL: expected scan create flags in help output"
            exit 1
          fi
          if [ -n "$SCAN_ID" ]; then
            echo "FAIL: expected no scan ID"
            exit 1
          fi
          echo "PASS"
