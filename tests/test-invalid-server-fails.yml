name: Test unreachable AST server fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          base_uri: http://127.0.0.1:1
          cx_tenant: test-tenant
          cx_client_id: test-client-id
          cx_client_secret: test-client-secret
          project_name: act-test-project
          branch: main
      - name: Assert the scan failed and no scan ID was produced
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SCAN_ID: ${{ steps.action.outputs.cxScanID }}
        run: |
          echo "outcome: $OUTCOME"
          echo "scan id: $SCAN_ID"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure against an unreachable server, got '$OUTCOME'"
            exit 1
          fi
          if [ -n "$SCAN_ID" ]; then
            echo "FAIL: expected no scan ID"
            exit 1
          fi
          echo "PASS"
