name: Test basic usage - Checkmarx AST Action
on:
  workflow_dispatch:
jobs:
  test-basic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          base_uri: "https://ast.checkmarx.net"
          cx_tenant: "test-tenant"
          cx_client_id: "fake-client-id"
          cx_client_secret: "fake-client-secret"
          project_name: "test-project"
          branch: "main"
          source_dir: "."

      - name: Assert action ran (succeeds or fails gracefully with invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          SCAN_ID: ${{ steps.action.outputs.cxScanID }}
          CLI_OUT: ${{ steps.action.outputs.cxcli }}
        run: |
          echo "outcome: $OUTCOME"
          echo "scan_id: $SCAN_ID"
          echo "cli_out: $CLI_OUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected with fake credentials)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
