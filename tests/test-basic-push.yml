name: Test basic push scenario
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Verify action.yml exists
        run: |
          if [ ! -f "action.yml" ]; then
            echo "FAIL: action.yml not found"
            exit 1
          fi
          echo "PASS: action.yml found"

      - name: Verify Dockerfile exists
        run: |
          if [ ! -f "Dockerfile" ]; then
            echo "FAIL: Dockerfile not found"
            exit 1
          fi
          echo "PASS: Dockerfile found"

      - name: Verify entrypoint script exists
        run: |
          if [ ! -f "entrypoint.sh" ]; then
            echo "FAIL: entrypoint.sh not found"
            exit 1
          fi
          echo "PASS: entrypoint.sh found"

      - id: action
        uses: .
        continue-on-error: true
        with:
          base_uri: 'https://ast.checkmarx.net'
          cx_tenant: 'test-tenant'
          cx_client_id: 'test-client-id'
          cx_client_secret: 'test-client-secret'
          project_name: 'test-project'
          branch: 'main'
          source_dir: '.'

      - name: Assert action was invoked
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail without real credentials
          # We just verify it was invoked (outcome is either success or failure, not skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to be invoked"
            exit 1
          fi
          echo "PASS: action was invoked (outcome: ${{ steps.action.outcome }})"
