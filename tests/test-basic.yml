name: Test basic usage with required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          base_uri: "https://ast.checkmarx.example.invalid"
          cx_tenant: "test-tenant"
          cx_client_id: "test-client-id"
          cx_client_secret: "test-client-secret"
          project_name: "test-project"
          branch: "main"
          source_dir: "."
      - name: Assert action was invoked (step ran regardless of outcome)
        run: |
          echo "Action step outcome: ${{ steps.action.outcome }}"
          # The action will fail to connect to the fake URL, but it must have been invoked.
          # Acceptable outcomes are 'success' or 'failure' (not 'skipped').
          OUTCOME="${{ steps.action.outcome }}"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped — it should have been invoked"
            exit 1
          fi
          echo "PASS: action was invoked (outcome=$OUTCOME)"
